packages:
  - "src/apps/*"
  - "src/packages/*"
  - "src/shared/*"

# Shared dependency versions. Everything added by the M0 scaffold is pinned to an exact version.
catalog:
  # React / build
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.5
  "@vitejs/plugin-react": 6.1.2
  "@types/node": 22.20.5
  # Tooling
  typescript: ~6.0.3
  vitest: 5.0.5
  jsdom: 30.1.3
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/user-event": 14.6.8
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  typescript-eslint: 8.72.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  eslint-plugin-jsx-a11y: 6.10.2
  globals: 17.13.0
  "@playwright/test": 1.64.1
  # Stories
  storybook: 10.6.3
  "@storybook/react-vite": 10.6.3
  # Fonts
  "@fontsource/instrument-sans": 5.3.0
  "@fontsource/jetbrains-mono": 5.3.0
  "@fontsource-variable/source-serif-4": 5.3.1
  # Strudel (see DECISIONS V1)
  "@strudel/core": 1.2.6
  "@strudel/mini": 1.2.6
  "@strudel/transpiler": 1.2.6
  "@strudel/tonal": 1.2.6
  "@strudel/webaudio": 1.3.0
  "@strudel/soundfonts": 1.3.0
  # State
  zustand: 5.0.15
