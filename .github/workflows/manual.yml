name: Manual

# Builds the VitePress manual (src/apps/manual) and publishes it to GitHub Pages.
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "src/apps/manual/**"
      - ".github/workflows/manual.yml"
  pull_request:
    paths:
      - "src/apps/manual/**"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter phyllo-manual test
      - name: Build
        run: pnpm --filter phyllo-manual build
        env:
          # Pages serves the site from https://<owner>.github.io/<repo>/.
          PHYLLO_MANUAL_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: src/apps/manual/docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
